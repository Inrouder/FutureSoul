name: Windows playable demo

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export-windows:
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.4.1
    steps:
      - uses: actions/checkout@v4
      - name: Import assets and scripts
        run: godot --headless --editor --path . --quit
      - name: Export Windows x64 demo
        run: |
          mkdir -p build
          godot --headless --path . --export-release "Windows Desktop" build/FutureSoul.exe
          test -s build/FutureSoul.exe
          ls -lh build
      - name: Upload portable game
        uses: actions/upload-artifact@v4
        with:
          name: FutureSoul-Windows-v0.2
          path: build/*
          if-no-files-found: error
          retention-days: 30
